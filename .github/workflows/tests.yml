# Runs the test suite on GitHub's computers every time code is pushed.
# No secrets are needed: the tests use a fake Notion and a fake AI.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the app's packages
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q
